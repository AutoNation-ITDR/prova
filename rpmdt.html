<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTONATION TEXAS | HUB</title>
    <link href="https://fonts.googleapis.com/css?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root { --p: #ff2e4d; --bg: #000; --s: #0a0a0a; --b: #1a1a1a; --t: #fff; --grad: linear-gradient(135deg, var(--p), #991b2d); }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: var(--t); font-family: 'Outfit', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        nav { width: 280px; background: var(--s); border-right: 1px solid var(--b); display: flex; flex-direction: column; padding: 40px 20px; z-index: 100; flex-shrink: 0; }
        .logo-box img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--p); object-fit: cover; margin-bottom: 40px; }
        .nav-link { background: rgba(255,255,255,0.02); border: 1px solid transparent; color: #888; padding: 14px 18px; border-radius: 12px; font-family: 'Orbitron'; font-size: 0.75rem; text-align: left; cursor: pointer; text-transform: uppercase; transition: 0.3s; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; width: 100%; }
        .nav-link.active { color: #fff; background: var(--grad); border-color: var(--p); }
        main { flex: 1; overflow-y: auto; background: radial-gradient(circle at top right, #0a0a0a, #000); }
        .page { display: none; padding: 50px; max-width: 1400px; margin: 0 auto; animation: fadeIn 0.4s ease forwards; }
        .page.active { display: block; }
        .glass-panel { background: #0a0a0a; border: 1px solid #1a1a1a; padding: 35px; border-radius: 20px; margin-bottom: 20px; }
        input, select { width: 100%; background: #000; border: 1px solid #222; color: #fff; padding: 14px; border-radius: 10px; margin-top: 6px; font-family: inherit; }
        .btn-action { width: 100%; padding: 18px; background: var(--grad); color: #fff; border: none; border-radius: 10px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; color: var(--p); font-family: 'Orbitron'; font-size: 0.7rem; border-bottom: 2px solid #1a1a1a; }
        td { padding: 12px; border-bottom: 1px solid #111; font-size: 0.85rem; }
        .result-box { margin-top: 20px; padding: 20px; background: #111; border-radius: 10px; border-left: 4px solid var(--p); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <nav>
        <div class="logo-box" style="text-align:center;">
            <img src="https://res.cloudinary.com/dtunh07qw/image/upload/v1774726227/prdrllnucdla95lhztwi.png" alt="Logo">
        </div>
        <button class="nav-link active" onclick="navTo('home', this)"><i class="fa-solid fa-house"></i> Home</button>
        <button class="nav-link" onclick="navTo('showroom', this)"><i class="fa-solid fa-car"></i> Showroom</button>
        <button class="nav-link" onclick="navTo('sales', this)"><i class="fa-solid fa-file-invoice-dollar"></i> Vendite</button>
        <button class="nav-link" onclick="navTo('plate-check', this)"><i class="fa-solid fa-shield-halved"></i> Check Targa</button>
        <button class="nav-link" onclick="navTo('clients', this)"><i class="fa-solid fa-users"></i> Clienti</button>
    </nav>

    <main>
        <div id="home" class="page active" style="text-align: center; padding-top: 120px;">
            <h1 style="font-family:'Orbitron'; font-size:4.5rem;">AUTO<span>NATION</span></h1>
            <p style="letter-spacing:8px; color:#555; margin-top:10px;">HOUSTON DATABASE CONNECTED</p>
        </div>

        <div id="showroom" class="page">
            <div id="showroom-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px;"></div>
        </div>

        <div id="sales" class="page">
            <div class="glass-panel" style="max-width: 650px; margin: auto;">
                <h2 style="font-family:'Orbitron'; margin-bottom:15px;">Registra <span>Vendita</span></h2>
                <input id="s-client" placeholder="Nome Cliente IC">
                <select id="s-car" onchange="autoFillPrice()"></select>
                <input id="s-price" type="number" placeholder="Prezzo Vendita ($)">
                <input id="s-plate" placeholder="Targa Veicolo (es. 84ABC12)">
                <input id="s-agent" placeholder="Nome Agente">
                <button class="btn-action" onclick="finalizeSale()">Genera Fattura Anti-Scam</button>
            </div>
        </div>

        <div id="plate-check" class="page">
            <div class="glass-panel" style="max-width: 600px; margin: auto;">
                <h2 style="font-family:'Orbitron';">DATABASE <span>CHECK TARGA</span></h2>
                <p style="color:#666; font-size:0.8rem; margin-top:5px;">Inserisci la targa per verificare la proprietà nel sistema.</p>
                <input id="search-plate" placeholder="Inserisci Targa..." style="text-transform: uppercase;">
                <button class="btn-action" onclick="checkPlate()">Cerca Targa</button>
                <div id="plate-result" class="result-box" style="display:none;"></div>
            </div>
        </div>

        <div id="clients" class="page">
            <div class="glass-panel">
                <h2 style="font-family:'Orbitron';">Database <span>Clienti</span></h2>
                <table>
                    <thead>
                        <tr><th>CLIENTE</th><th>STATO</th><th>NOTE VENDITA</th></tr>
                    </thead>
                    <tbody id="clients-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURAZIONE DATABASE REALTIME HOUSTON
        const fbConfig = { databaseURL: "https://staff-houston-default-rtdb.europe-west1.firebasedatabase.app/" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();

        const WH_FATTURE = "https://discord.com/api/webhooks/1487566509982355487/dekKyZ-WeiUCUvTpeacX6YSBRssl3e_27xTTgxQwPYdOrUP8bREE1hOIOpsw-_A7rC_W";

        let carsCache = {};

        function navTo(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        // SINCRONIZZAZIONE DATI
        db.ref('cars').on('value', s => {
            carsCache = s.val() || {};
            const grid = document.getElementById('showroom-grid');
            const select = document.getElementById('s-car');
            grid.innerHTML = ""; select.innerHTML = "<option>Seleziona Veicolo</option>";
            for(let id in carsCache) {
                grid.innerHTML += `<div class="glass-panel" style="padding:0; overflow:hidden;">
                    <img src="${carsCache[id].img || 'https://via.placeholder.com/300'}" style="width:100%; height:160px; object-fit:cover;">
                    <div style="padding:15px;"><h4>${carsCache[id].name}</h4><p style="color:var(--p)">$ ${carsCache[id].price}</p></div>
                </div>`;
                select.innerHTML += `<option value="${carsCache[id].name}">${carsCache[id].name}</option>`;
            }
        });

        db.ref('clients').on('value', s => {
            const list = document.getElementById('clients-list');
            list.innerHTML = "";
            const data = s.val();
            for(let id in data) {
                list.innerHTML += `<tr>
                    <td><b>${data[id].name}</b></td>
                    <td><span style="color:limegreen;">ATTIVO</span></td>
                    <td>${data[id].note || 'N/A'}</td>
                </tr>`;
            }
        });

        // VENDITA CON WATERMARK ANTI-SCAM
        async function finalizeSale() {
            const client = document.getElementById('s-client').value.trim().toUpperCase();
            const car = document.getElementById('s-car').value;
            const price = document.getElementById('s-price').value;
            const plate = document.getElementById('s-plate').value.trim().toUpperCase();
            const agent = document.getElementById('s-agent').value.trim().toUpperCase();

            if(!client || !price || !plate) return alert("Compila tutti i campi obbligatori!");

            // Generazione Hash Anti-Scam
            const securityCode = "AN-TEX-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            const commission = (price * 0.03).toFixed(0); // 3% commissione agente

            // Salva Registro Targa & Cliente su Firebase Houston
            db.ref('plates/' + plate).set({ owner: client, car: car, registeredBy: agent, date: new Date().toLocaleDateString() });
            db.ref('clients').push({ name: client, note: `Acquistata ${car} [Targa: ${plate}]` });

            // Generazione PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(10, 10, 10); doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(255, 46, 77); doc.setFontSize(26); doc.text("AUTONATION TEXAS", 105, 30, {align:"center"});
            
            doc.setTextColor(255, 255, 255); doc.setFontSize(12);
            doc.text(`CLIENTE: ${client}`, 20, 60);
            doc.text(`VEICOLO: ${car}`, 20, 70);
            doc.text(`TARGA: ${plate}`, 20, 80);
            doc.text(`PREZZO TOTALE: $${price}`, 20, 90);
            doc.text(`AGENTE VENDITORE: ${agent}`, 20, 100);
            
            doc.setFontSize(9); doc.setTextColor(100, 100, 100);
            doc.text(`CODICE SICUREZZA ANTI-SCAM: ${securityCode}`, 20, 280);

            doc.save(`Fattura_${plate}_${client}.pdf`);

            // Discord Webhook Log
            fetch(WH_FATTURE, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "🧾 NUOVA VENDITA REGISTRATA",
                        color: 16723533,
                        fields: [
                            { name: "👤 Cliente", value: client, inline: true },
                            { name: "🚘 Veicolo", value: car, inline: true },
                            { name: "🏷️ Targa", value: plate, inline: true },
                            { name: "💰 Prezzo", value: `$${price}`, inline: true },
                            { name: "💵 Bonus Agente (3%)", value: `$${commission}`, inline: true },
                            { name: "🔑 Codice Unico", value: securityCode, inline: false }
                        ]
                    }]
                })
            });

            alert("Vendita salvata sul DB Houston e Fattura Generata!");
        }

        // SISTEMA CHECK TARGA
        function checkPlate() {
            const plate = document.getElementById('search-plate').value.trim().toUpperCase();
            const resBox = document.getElementById('plate-result');

            if(!plate) return;

            db.ref('plates/' + plate).get().then(snapshot => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    resBox.style.display = 'block';
                    resBox.innerHTML = `
                        <h3 style="color:limegreen;"><i class="fa-solid fa-circle-check"></i> TARGA REGISTRATA</h3>
                        <p style="margin-top:10px;"><b>Proprietario:</b> ${data.owner}</p>
                        <p><b>Veicolo:</b> ${data.car}</p>
                        <p><b>Registrato da:</b> ${data.registeredBy} (${data.date})</p>
                    `;
                } else {
                    resBox.style.display = 'block';
                    resBox.innerHTML = `<h3 style="color:var(--p);"><i class="fa-solid fa-circle-xmark"></i> TARGA NON TROVATA</h3><p style="margin-top:5px; color:#888;">Nessun veicolo presente nel registro Houston con questa targa.</p>`;
                }
            });
        }

        function autoFillPrice() {
            const val = document.getElementById('s-car').value;
            for(let id in carsCache) if(carsCache[id].name === val) document.getElementById('s-price').value = carsCache[id].price;
        }
    </script>
</body>
</html>
